// KMC Build 14.18.4 Rev B
// Passive powered-instrument electrical prototype.
//
// Architecture:
// - ASET remains authoritative for native cockpit/global power behavior.
// - KMC adds only an assigned electrical-domain dependency.
// - Existing ASET native power-off animations / PowerOFFloc mechanisms are reused.
// - No JSILabel replacement.
// - No renderer, material, texture, mesh, or RenderTexture manipulation.
//
// Effective power-off:
//     ASET native power-off OR KMC assigned-bus off
//
// RPM source behavior was verified before this build:
// a one-source NAND is logical NOT, so *_OFF is safely derived from the
// already-proven cacheable KMC *_POWERED variables.

// -------------------------------------------------------------------------
// Reusable KMC bus-OFF truth
// -------------------------------------------------------------------------

RPM_CUSTOM_VARIABLE
{
    name = KMC_MAIN_A_OFF
    operator = NAND
    SOURCE_VARIABLE
    {
        name = KMC_MAIN_A_POWERED
        range = 0.5, 1.1
    }
}

RPM_CUSTOM_VARIABLE
{
    name = KMC_MAIN_B_OFF
    operator = NAND
    SOURCE_VARIABLE
    {
        name = KMC_MAIN_B_POWERED
        range = 0.5, 1.1
    }
}

RPM_CUSTOM_VARIABLE
{
    name = KMC_ESS_OFF
    operator = NAND
    SOURCE_VARIABLE
    {
        name = KMC_ESS_POWERED
        range = 0.5, 1.1
    }
}

// -------------------------------------------------------------------------
// Effective ASET power-off truth by KMC domain.
// -------------------------------------------------------------------------

RPM_CUSTOM_VARIABLE
{
    name = KMC_MAIN_A_POWEROFF
    operator = OR
    SOURCE_VARIABLE
    {
        name = CUSTOM_ALCOR_POWEROFF
        range = 0.5, 1.1
    }
    SOURCE_VARIABLE
    {
        name = CUSTOM_KMC_MAIN_A_OFF
        range = 0.5, 1.1
    }
}

RPM_CUSTOM_VARIABLE
{
    name = KMC_MAIN_B_POWEROFF
    operator = OR
    SOURCE_VARIABLE
    {
        name = CUSTOM_ALCOR_POWEROFF
        range = 0.5, 1.1
    }
    SOURCE_VARIABLE
    {
        name = CUSTOM_KMC_MAIN_B_OFF
        range = 0.5, 1.1
    }
}

RPM_CUSTOM_VARIABLE
{
    name = KMC_ESS_POWEROFF
    operator = OR
    SOURCE_VARIABLE
    {
        name = CUSTOM_ALCOR_POWEROFF
        range = 0.5, 1.1
    }
    SOURCE_VARIABLE
    {
        name = CUSTOM_KMC_ESS_OFF
        range = 0.5, 1.1
    }
}

// -------------------------------------------------------------------------
// DigitalIndicator family
// Existing native DigitalIndicatorPowerOffAnim is retained.
// -------------------------------------------------------------------------

+PROP[DigitalIndicator_CURRENT_WARP]:NEEDS[RasterPropMonitor]
{
    @name = KMC_DigitalIndicator_CURRENT_WARP_MAIN_A
    @MODULE[JSICallbackAnimator],0
    {
        @variableName = CUSTOM_KMC_MAIN_A_POWEROFF
    }
}

