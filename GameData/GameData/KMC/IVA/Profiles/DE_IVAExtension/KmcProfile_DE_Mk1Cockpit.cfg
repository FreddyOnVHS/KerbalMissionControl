// KMC Build 14.18.4 Rev B
// IVA electrical profile: DE_IVAExtension stock Mk1 Cockpit
// Verified INTERNAL: DE_mk1CockpitInternal
//
// Existing frozen assignments:
//   MFD #0                    -> MAIN A
//   MFD #1                    -> MAIN B
//   WARP                      -> MAIN A
//   MECO                      -> MAIN B
//   ENGINE FLAME OUT          -> ESS
//   ENGINE OVERHEAT           -> ESS
//   LOW TWR                   -> MAIN A
//   HIGH SLOPE                -> ESS
//   GROUND PROX               -> ESS
//   LANDING GEAR              -> MAIN B
//
// 14.18.4 passive powered instruments:
//   CURRENT WARP digital      -> MAIN A
//   DELTA-V STAGE digital     -> ESS
//   G-FORCE digital           -> ESS
//   ELECTRICAL OUTPUT digital -> ESS
//   INTAKE AIR circular       -> ESS
//   RCS/LIQUID FUEL circular  -> ESS
//   ENGINE TEMP circular      -> ESS
//   TWR circular              -> ESS
//   G-FORCE circular          -> ESS
//
// These are KMC modeled electrical-domain assignments. They do not claim
// undocumented DE_IVAExtension / ASET cockpit wiring.

@INTERNAL[DE_mk1CockpitInternal]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }

    @PROP[OnWARP],0
    {
        @name = KMC_OnWARP_MAIN_A
    }

    @PROP[onMECOIndicator],0
    {
        @name = KMC_onMECOIndicator_MAIN_B
    }

    @PROP[onENGFAILUREIndicator],0
    {
        @name = KMC_onENGFAILUREIndicator_ESS
    }

    @PROP[AlarmEngineOverheatIndicator],0
    {
        @name = KMC_AlarmEngineOverheatIndicator_ESS
    }

    @PROP[LowTWRIndicator],0
    {
        @name = KMC_LowTWRIndicator_MAIN_A
    }

    @PROP[AlarmHighSlopeIndicator],0
    {
        @name = KMC_AlarmHighSlopeIndicator_ESS
    }

    @PROP[AlarmGroundProximityIndicator],0
    {
        @name = KMC_AlarmGroundProximityIndicator_ESS
    }

    @PROP[AlarmLLegsIndicator],0
    {
        @name = KMC_AlarmLLegsIndicator_MAIN_B
    }

    @PROP[DigitalIndicator_CURRENT_WARP],0
    {
        @name = KMC_DigitalIndicator_CURRENT_WARP_MAIN_A
    }

    @PROP[DigitalIndicator_DELTAV],0
    {
        @name = KMC_DigitalIndicator_DELTAV_ESS
    }

    @PROP[DigitalIndicator_GFORCE],0
    {
        @name = KMC_DigitalIndicator_GFORCE_ESS
    }

    @PROP[DigitalIndicator_Elec_Output],0
    {
        @name = KMC_DigitalIndicator_Elec_Output_ESS
    }

    @PROP[IndicatorCircular_INTAKEAIR],0
    {
        @name = KMC_IndicatorCircular_INTAKEAIR_ESS
    }

    @PROP[IndicatorCircular_FUEL],0
    {
        @name = KMC_IndicatorCircular_FUEL_ESS
    }

    @PROP[IndicatorCircular_EngineTemp],0
    {
        @name = KMC_IndicatorCircular_EngineTemp_ESS
    }

    @PROP[IndicatorCircular_TWR],0
    {
        @name = KMC_IndicatorCircular_TWR_ESS
    }

    @PROP[IndicatorCircular_GFORCE],0
    {
        @name = KMC_IndicatorCircular_GFORCE_ESS
    }
}
