// -------------------------------------------------------------------------
// Build 14.18.4 Rev C — runtime-inspector-verified passive props -> ESS
//
// Selection rule:
// - prop changed in genuine zero-EC runtime comparison
// - native ASET power-off mechanism is identifiable
// - no renderer/material/texture forcing
//
// Direct JSICallbackAnimator props are matched by their actual native
// CUSTOM_ALCOR_POWEROFF variable instead of a hard-coded module index.
// -------------------------------------------------------------------------

+PROP[IndicatorCircular_MONOPROP]:NEEDS[RasterPropMonitor]
{
    @name = KMC_IndicatorCircular_MONOPROP_ESS

    @MODULE[JSICallbackAnimator]:HAS[#variableName[CUSTOM_ALCOR_POWEROFF]]
    {
        @variableName = CUSTOM_KMC_ESS_POWEROFF
    }
}

+PROP[GforceDisplay]:NEEDS[RasterPropMonitor]
{
    @name = KMC_GforceDisplay_ESS

    @MODULE[JSICallbackAnimator]:HAS[#variableName[CUSTOM_ALCOR_POWEROFF]]
    {
        @variableName = CUSTOM_KMC_ESS_POWEROFF
    }
}

// FuelMonitor's native power-off input is a VARIABLESET nested inside
// JSIVariableAnimator rather than a direct JSICallbackAnimator variable.
+PROP[FuelMonitor]:NEEDS[RasterPropMonitor]
{
    @name = KMC_FuelMonitor_ESS

    // FuelMonitor has one JSIVariableAnimator.
    // Upstream verified VARIABLESET ordering:
    //   0 fuel flow
    //   1 oxidizer flow
    //   2 monoprop flow
    //   3 fuel valve
    //   4 oxidizer valve
    //   5 monoprop valve
    //   6 native CUSTOM_ALCOR_POWEROFF -> FuelMonitorMaskPowerOFF
    //
    // Rev C's nested :HAS selector did not alter the runtime power-off state.
    // Rev D therefore targets the verified native power VARIABLESET directly.
    @MODULE[JSIVariableAnimator],0
    {
        @VARIABLESET,6
        {
            @variableName = CUSTOM_KMC_ESS_POWEROFF
        }
    }
}

