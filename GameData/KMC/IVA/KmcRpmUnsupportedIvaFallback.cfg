// KMC Build 14.17.3
// Generic unsupported-IVA fallback for the proven ASET/RPM ALCORMFD40x20 family.
//
// IMPORTANT:
// - Explicit IVA profiles run earlier and rename known physical MFD instances to
//   KMC_ALCORMFD40x20_MAIN_A / MAIN_B / ESS.
// - This FINAL fallback only sees ALCORMFD40x20 instances that remain untouched.
// - Untouched / unknown instances are conservatively assigned to ESS.
// - This does NOT alter RPM rendering, meshes, textures, page state, or recovery.
//   The existing KMC_ALCORMFD40x20_ESS prop uses RPM's native power handling.
//
// Result:
// - Known profiled IVA: verified A/B/ESS wiring is preserved.
// - Unknown compatible IVA: basic KMC electrical behavior is provided safely.
// - Unsupported prop families: untouched.

@INTERNAL[*]:HAS[@PROP[ALCORMFD40x20]]:NEEDS[RasterPropMonitor]:FINAL
{
    @PROP[ALCORMFD40x20],*
    {
        @name = KMC_ALCORMFD40x20_ESS
    }
}
