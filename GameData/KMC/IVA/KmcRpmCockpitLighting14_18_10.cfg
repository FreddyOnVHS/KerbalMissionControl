// KMC Build 14.20.6 — Supported DE IVA Cockpit Lighting
//
// ASET native command/output architecture:
//   crew command = PERSISTENT_BackLight
//   effective output = CUSTOM_ALCOR_BACKLIGHT_ON
//
// Rev C proved the correct electrical behavior by adding ESS truth to
// ALCOR_BACKLIGHT_ON:
//   ON -> ESS loss -> dark -> ESS restore -> automatically ON
//   OFF -> ESS loss -> ESS restore -> remains OFF
//
// Production scoping:
// KMC_DE_IVA_BACKLIGHT_ALLOW is 0/1 ESS truth only when the current IVA is
// positively identified as a supported DE_IVAExtension interior through
// Build 14.20.5.
//
// Every other cockpit / unknown profile / missing KMC status returns 1,
// preserving native ASET behavior.
//
// KMC never modifies PERSISTENT_BackLight.
// No Unity Light / renderer / material / texture / mesh manipulation.

@RPM_CUSTOM_VARIABLE[ALCOR_BACKLIGHT_ON]:NEEDS[RasterPropMonitor]
{
    SOURCE_VARIABLE
    {
        name = KMC_DE_IVA_BACKLIGHT_ALLOW
        range = 0.5, 1.1
    }
}
