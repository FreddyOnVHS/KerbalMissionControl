// KMC Build 14.17.1
// IVA electrical profile: DE_IVAExtension stock Mk2 Spaceplane Cockpit
//
// Upstream IVA:
//     INTERNAL = DE_mk2CockpitStandardInternals
//
// Electrical assignment:
//     ALCORMFD40x20 #0 -> MAIN A
//     ALCORMFD40x20 #1 -> MAIN B
//     ALCORMFD40x20 #2 -> MAIN A
//     ALCORMFD40x20 #3 -> MAIN B
//
// This proves the profile format supports arbitrary MFD counts.  A later
// profile may freely use MAIN A / MAIN B / ESS in any arrangement.

@INTERNAL[DE_mk2CockpitStandardInternals]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }

    @PROP[ALCORMFD40x20],2
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],3
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }
}
