// KMC Build 14.17.1
// IVA electrical profile: DE_IVAExtension stock Mk1 Command Pod v2
//
// Upstream IVA:
//     INTERNAL = DE_mk1pod_IVA
//
// Electrical assignment:
//     ALCORMFD40x20 #0 -> MAIN A
//     ALCORMFD40x20 #1 -> MAIN B
//
// The profile only maps physical MFD instances to KMC power-domain prop
// families.  All blackout / recovery behavior is defined generically in
// KmcRpmPowerDomains.cfg.

@INTERNAL[DE_mk1pod_IVA]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }
}
