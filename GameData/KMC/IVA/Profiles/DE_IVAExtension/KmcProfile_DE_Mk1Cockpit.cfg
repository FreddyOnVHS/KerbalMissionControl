// KMC Build 14.18.9 — Passive IVA Power Coverage Expansion / Batch A
// IVA electrical profile: DE_IVAExtension stock Mk1 Cockpit
// Verified INTERNAL: DE_mk1CockpitInternal
//
// Existing frozen assignments:
//   MFD #0                    -> MAIN A
//   MFD #1                    -> MAIN B
//   WARP                      -> MAIN A
//   MECO                      -> MAIN B
//   ENGINE FLAME OUT          -> ESS
//   ENGINE OVERHEAT           -> ESS
//   LOW TWR                   -> MAIN A
//   HIGH SLOPE                -> ESS
//   GROUND PROX               -> ESS
//   LANDING GEAR              -> MAIN B
//
// 14.18.4 passive powered instruments:
//   CURRENT WARP digital      -> MAIN A
//   DELTA-V STAGE digital     -> ESS
//   G-FORCE digital           -> ESS
//   ELECTRICAL OUTPUT digital -> ESS
//   INTAKE AIR circular       -> ESS
//   RCS/LIQUID FUEL circular  -> ESS
//   ENGINE TEMP circular      -> ESS
//   TWR circular              -> ESS
//   G-FORCE circular          -> ESS
//   MONOPROP circular         -> ESS
//   GforceDisplay             -> ESS
//   FuelMonitor               -> ESS
//   AMBIENT TEMP digital      -> ESS
//   EXTERNAL TEMP digital     -> ESS
//   DYNAMIC PRESSURE digital  -> ESS
//   ATM DENSITY digital       -> ESS
//   SURFACE TEMP digital      -> ESS
//
// 14.18.9 Batch A passive powered instruments:
//   ALTITUDE WARN setup       -> ESS
//   CHARGE CONSUMPTION        -> ESS
//   ELECTRIC CHARGE LEVEL     -> ESS
//   STAGE FUEL indicator      -> ESS
//   THROTTLE indicator        -> ESS
//
// These are KMC modeled electrical-domain assignments. They do not claim
// undocumented DE_IVAExtension / ASET cockpit wiring.

@INTERNAL[DE_mk1CockpitInternal]:NEEDS[RasterPropMonitor]
{
