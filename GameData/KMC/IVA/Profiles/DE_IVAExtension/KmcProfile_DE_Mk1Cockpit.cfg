// KMC Build 14.18.3
// IVA electrical profile: DE_IVAExtension stock Mk1 Cockpit
// Verified INTERNAL: DE_mk1CockpitInternal
//
// KMC modeled electrical-domain assignments:
//   MFD #0                    -> MAIN A
//   MFD #1                    -> MAIN B
//   WARP                      -> MAIN A
//   MECO                      -> MAIN B
//   ENGINE FLAME OUT          -> ESS
//   ENGINE OVERHEAT           -> ESS
//   LOW TWR                   -> MAIN A
//   HIGH SLOPE                -> ESS
//   GROUND PROX               -> ESS
//   LANDING GEAR              -> MAIN B
//
// These assignments model KMC redundancy. They do not claim undocumented
// electrical wiring in DE_IVAExtension / ASET Props.

@INTERNAL[DE_mk1CockpitInternal]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }

    @PROP[OnWARP],0
    {
        @name = KMC_OnWARP_MAIN_A
    }

    @PROP[onMECOIndicator],0
    {
        @name = KMC_onMECOIndicator_MAIN_B
    }

    @PROP[onENGFAILUREIndicator],0
    {
        @name = KMC_onENGFAILUREIndicator_ESS
    }

    @PROP[AlarmEngineOverheatIndicator],0
    {
        @name = KMC_AlarmEngineOverheatIndicator_ESS
    }

    @PROP[LowTWRIndicator],0
    {
        @name = KMC_LowTWRIndicator_MAIN_A
    }

    @PROP[AlarmHighSlopeIndicator],0
    {
        @name = KMC_AlarmHighSlopeIndicator_ESS
    }

    @PROP[AlarmGroundProximityIndicator],0
    {
        @name = KMC_AlarmGroundProximityIndicator_ESS
    }

    @PROP[AlarmLLegsIndicator],0
    {
        @name = KMC_AlarmLLegsIndicator_MAIN_B
    }
}
