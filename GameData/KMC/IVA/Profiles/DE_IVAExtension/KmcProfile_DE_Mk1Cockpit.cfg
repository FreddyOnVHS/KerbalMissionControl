// KMC Build 14.18.1 Rev B
// IVA electrical profile: DE_IVAExtension stock Mk1 Cockpit
//
// Verified upstream INTERNAL:
//     DE_mk1CockpitInternal
//
// Verified upstream ALCORMFD40x20 count:
//     2
//
// MFD electrical assignment:
//     MFD #0 -> MAIN A
//     MFD #1 -> MAIN B
//
// Powered-annunciator prototype:
//     OnWARP -> MAIN A
//
// The OnWARP condition still comes from ASET/RPM.  KMC only gates whether the
// MAIN A electrical domain is available to illuminate the annunciator.

@INTERNAL[DE_mk1CockpitInternal]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }

    @PROP[OnWARP],0
    {
        @name = KMC_OnWARP_MAIN_A
    }
}
