// KMC Build 14.15.1
// Read-only RPM bridge. No crew control path exists in this build.
//
// RasterPropMonitor discovers ordinary PartModules through these handler nodes.
// All variables are marked non-cacheable because the KMC status lease is live.
RPMCVARIABLEHANDLER
{
    name = KmcRpmVariableHandler
    method = ProcessVariable

    variable = KMC_AVAILABLE,0,false
    variable = KMC_LINK,NO KMC LINK,false

    variable = KMC_MAIN_A_V,--,false
    variable = KMC_MAIN_A_STATE,--,false
    variable = KMC_MAIN_A_SOURCE,--,false

    variable = KMC_MAIN_B_V,--,false
    variable = KMC_MAIN_B_STATE,--,false
    variable = KMC_MAIN_B_SOURCE,--,false

    variable = KMC_ESS_V,--,false
    variable = KMC_ESS_STATE,--,false
    variable = KMC_ESS_SOURCE,--,false

    variable = KMC_BAT_A_STATE,--,false
    variable = KMC_BAT_B_STATE,--,false
}

// The user's DE_IVAExtension Mk2 Command Pod uses ASET's ALCORMFD40x20.
// Preserve both existing resource pages and append KMC SYS / POWER as the
// third page on the same RESC.ST/TOT (button_G) page cycle.
@PROP[ALCORMFD40x20]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = KMC_SYS_POWER
            button = button_G
            text = KMC/IVA/KmcPower40x20.txt
        }
    }
}
