// KMC Build 14.18.3
// Read-only RPM bridge plus logical electrical power-domain variables.
RPMCVARIABLEHANDLER
{
    name = KmcRpmVariableHandler
    method = ProcessVariable

    variable = KMC_AVAILABLE,0,false
    variable = KMC_LINK,NO KMC LINK,false

    variable = KMC_MAIN_A_POWERED,1,true
    variable = KMC_MAIN_B_POWERED,1,true
    variable = KMC_ESS_POWERED,1,true

    variable = KMC_MAIN_A_V,--,false
    variable = KMC_MAIN_A_STATE,--,false
    variable = KMC_MAIN_A_SOURCE,--,false

    variable = KMC_MAIN_B_V,--,false
    variable = KMC_MAIN_B_STATE,--,false
    variable = KMC_MAIN_B_SOURCE,--,false

    variable = KMC_ESS_V,--,false
    variable = KMC_ESS_STATE,--,false
    variable = KMC_ESS_SOURCE,--,false

    variable = KMC_BAT_A_STATE,--,false
    variable = KMC_BAT_B_STATE,--,false
}

// Explicit F10 IVA test inputs. These are test variables only: they are not
// telemetry and they are not synthetic failure truth.
RPMCVARIABLEHANDLER
{
    name = KmcIvaAnnunciatorTestVariableHandler
    method = ProcessVariable

    variable = KMC_IVA_TEST_WARP,0,true
    variable = KMC_IVA_TEST_MECO,0,true
    variable = KMC_IVA_TEST_ENG_FAILURE,0,true
    variable = KMC_IVA_TEST_ENG_OVERHEAT,0,true

    variable = KMC_IVA_TEST_LOW_TWR,0,true
    variable = KMC_IVA_TEST_HIGH_SLOPE,0,true
    variable = KMC_IVA_TEST_GROUND_PROX,0,true
    variable = KMC_IVA_TEST_LANDING_GEAR,0,true
}

@PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = KMC_SYS_POWER
            button = button_G
            text = KMC/IVA/KmcPower40x20.txt
        }
    }
}
