// KMC Build 14.18.9 — Passive IVA Power Coverage Expansion / Batch A
//
// Reference cockpit:
//   DE_IVAExtension / DE_mk1CockpitInternal
//
// Architecture:
// - Reuse ASET's native CUSTOM_ALCOR_POWEROFF callback.
// - KMC changes only the assigned electrical-domain power-off input.
// - Effective power-off remains:
//       ASET native power-off OR KMC assigned-bus off
// - No renderer/material/texture/mesh forcing.
// - No switch/button behavior changes.
// - No annunciator changes.
// - No cockpit-lighting changes.
//
// The five upstream ASET props below were individually verified to contain a
// native JSICallbackAnimator whose variableName is CUSTOM_ALCOR_POWEROFF.
//
// 14.18.9 Batch A assignments:
//   DigitalIndicator_ALT_WARN_SetupDisplay -> ESS
//   IndADV_2Scales_ChargeCons              -> ESS
//   IndicatorADV_CHARGE                    -> ESS
//   IndicatorADV_STAGE                     -> ESS
//   IndicatorADV_THROTTLE                  -> ESS
//
// These are KMC modeled electrical-domain assignments. They do not claim
// undocumented DE_IVAExtension / ASET spacecraft wiring.

+PROP[DigitalIndicator_ALT_WARN_SetupDisplay]:NEEDS[RasterPropMonitor]
{
    @name = KMC_DigitalIndicator_ALT_WARN_SetupDisplay_ESS

    @MODULE[JSICallbackAnimator]:HAS[#variableName[CUSTOM_ALCOR_POWEROFF]]
    {
        @variableName = CUSTOM_KMC_ESS_POWEROFF
    }
}

+PROP[IndADV_2Scales_ChargeCons]:NEEDS[RasterPropMonitor]
{
    @name = KMC_IndADV_2Scales_ChargeCons_ESS

    @MODULE[JSICallbackAnimator]:HAS[#variableName[CUSTOM_ALCOR_POWEROFF]]
