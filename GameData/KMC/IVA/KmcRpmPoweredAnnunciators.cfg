// KMC Build 14.18.11
// Powered ASET/RPM annunciators — Mk1 warning-panel completion.
//
// Existing 14.18.3 tested annunciators preserve:
//   (real ASET condition OR explicit F10 IVA test input)
//       AND assigned KMC bus powered
//       = illuminated annunciator
//
// Build 14.18.11 adds the nine remaining passive warning/caution lamps from
// DE_mk1CockpitInternal. These new lamps use native ASET warning truth only:
//   real ASET condition
//       AND assigned KMC bus powered
//       = illuminated annunciator
//
// Bus assignments are KMC modeled electrical domains. They do not claim
// undocumented upstream cockpit wiring.
//
// No renderer, mesh, material, texture, RenderTexture, Unity Light, or control
// manipulation.

// ============================================================================
// FROZEN 14.18.3 ANNUNCIATORS
// ============================================================================

// WARP -> MAIN A
RPM_CUSTOM_VARIABLE
{
    name = KMC_ONWARP_EFFECTIVE
    operator = OR

    SOURCE_VARIABLE
    {
        name = CUSTOM_ASET_WARP_ON
        range = 0.5, 1.1
    }

    SOURCE_VARIABLE
    {
        name = KMC_IVA_TEST_WARP
        range = 0.5, 1.1
    }
}

RPM_CUSTOM_VARIABLE
{
    name = KMC_ONWARP_MAIN_A_ON
    operator = AND

    SOURCE_VARIABLE
    {
        name = CUSTOM_KMC_ONWARP_EFFECTIVE
        range = 0.5, 1.1
    }

    SOURCE_VARIABLE
    {
        name = KMC_MAIN_A_POWERED
        range = 0.5, 1.1
    }
}

+PROP[OnWARP]:NEEDS[RasterPropMonitor]
{
    @name = KMC_OnWARP_MAIN_A

    @MODULE[JSILabel]
    {
        @variableName = CUSTOM_KMC_ONWARP_MAIN_A_ON
        %zeroColor = 0,0,0,255
        %negativeColor = 0,0,0,255
    }

    @MODULE[JSICallbackAnimator]
    {
        @variableName = CUSTOM_KMC_ONWARP_MAIN_A_ON
    }
}

