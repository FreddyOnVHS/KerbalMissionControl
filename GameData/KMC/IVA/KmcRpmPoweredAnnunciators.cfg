// HIGH G -> ESS
// The lamp uses CUSTOM_ALCOR_HIGHG_ON.
// Its alarm audio uses CUSTOM_ALCOR_EXTREMEG_ALARM_ON.
// Both are electrically gated so a dead annunciator circuit cannot keep
// sounding an electrically powered cockpit warning.
RPM_CUSTOM_VARIABLE
{
    name = KMC_HIGHG_ESS_ON
    operator = AND

    SOURCE_VARIABLE
    {
        name = CUSTOM_ALCOR_HIGHG_ON
        range = 0.5, 1.1
    }

    SOURCE_VARIABLE
    {
        name = KMC_ESS_POWERED
        range = 0.5, 1.1
    }
}

RPM_CUSTOM_VARIABLE
{
    name = KMC_EXTREMEG_ESS_ON
    operator = AND

    SOURCE_VARIABLE
    {
        name = CUSTOM_ALCOR_EXTREMEG_ALARM_ON
        range = 0.5, 1.1
    }

    SOURCE_VARIABLE
    {
        name = KMC_ESS_POWERED
        range = 0.5, 1.1
    }
}

