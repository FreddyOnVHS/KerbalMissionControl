// KMC Build 14.18.1 Rev B
// Powered annunciator prototype.
//
// Architecture:
// - ASET/RPM remains the source of annunciator condition truth.
// - KMC only gates whether electrical power is available to illuminate it.
// - No renderer, mesh, material, texture, or RenderTexture manipulation.
// - Mission Control link loss remains fail-open through KMC_MAIN_A_POWERED.
//
// Prototype:
//     OnWARP -> MAIN A
//
// ASET's original OnWARP prop uses CUSTOM_ASET_WARP_ON for both its JSILabel
// and JSICallbackAnimator.  The KMC variant replaces that one condition input
// with a composite RPM custom variable:
//     ASET warp condition AND KMC MAIN A powered.
//
// Rev B clarification:
// ASET intentionally gives the stock OnWARP label a dim-green zeroColor, so an
// OFF indicator remains visibly green.  That made an electrically unpowered
// KMC annunciator visually ambiguous even when the composite variable was zero.
// The KMC clone therefore sets JSILabel zeroColor to true black.  This is a
// normal RPM label configuration value, not a Unity renderer workaround.
//
// Result:
// - No warp, bus powered       -> dark
// - Warp, bus powered          -> illuminated
// - Warp, MAIN A failed        -> dark
// - No KMC link (fail-open)    -> normal ASET warp behavior

RPM_CUSTOM_VARIABLE
{
    name = KMC_ONWARP_MAIN_A_ON
    operator = AND

    SOURCE_VARIABLE
    {
        name = CUSTOM_ASET_WARP_ON
        range = 0.5, 1.1
    }

    SOURCE_VARIABLE
    {
        name = KMC_MAIN_A_POWERED
        range = 0.5, 1.1
    }
}

+PROP[OnWARP]:NEEDS[RasterPropMonitor]
{
    @name = KMC_OnWARP_MAIN_A

    @MODULE[JSILabel]
    {
        @variableName = CUSTOM_KMC_ONWARP_MAIN_A_ON
        %zeroColor = 0,0,0,255
        %negativeColor = 0,0,0,255
    }

    @MODULE[JSICallbackAnimator]
    {
        @variableName = CUSTOM_KMC_ONWARP_MAIN_A_ON
    }
}
