// KMC Build 14.16.7
// RPM-native IVA electrical-domain profile.
//
// ROOT CAUSE RESOLUTION
// ---------------------
// RasterPropMonitor already contains the exact behavior KMC needs:
//   needsElectricCharge = true
//   resourceName = <any RPM numeric variable>
//
// RPM registers a resource callback for resourceName.  When that variable is
// below 0.01, RPM itself:
//   - blocks monitor button/page clicks,
//   - clears its own RenderTexture to emptyColor,
//   - resumes normal rendering automatically when the variable rises again.
//
// KMC therefore does NOT manipulate Unity renderers, textures, meshes, or
// colliders in this build.  RPM owns its display lifecycle.
//
// The KMC *_POWERED variables are numeric 1 / 0 and are marked cacheable=true
// in KmcRpmBridge.cfg so RPM's value-change callback path actually fires.

+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]
{
    @name = KMC_ALCORMFD40x20_MAIN_A

    @MODULE[RasterPropMonitor]
    {
        %needsElectricCharge = true
        %resourceName = KMC_MAIN_A_POWERED

        // ASET already defines this as black. Keep it explicit for KMC clones.
        %emptyColor = 0,0,0,255
    }

    MODULE
    {
        name = KmcRpmPowerWake
        powerDomain = MAIN_A
    }
}

+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]
{
    @name = KMC_ALCORMFD40x20_MAIN_B

    @MODULE[RasterPropMonitor]
    {
        %needsElectricCharge = true
        %resourceName = KMC_MAIN_B_POWERED
        %emptyColor = 0,0,0,255
    }

    MODULE
    {
        name = KmcRpmPowerWake
        powerDomain = MAIN_B
    }
}

+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]
{
    @name = KMC_ALCORMFD40x20_ESS

    @MODULE[RasterPropMonitor]
    {
        %needsElectricCharge = true
        %resourceName = KMC_ESS_POWERED
        %emptyColor = 0,0,0,255
    }

    MODULE
    {
        name = KmcRpmPowerWake
        powerDomain = ESS
    }
}

// DE_IVAExtension — stock Mk1 Command Pod v2.
@INTERNAL[DE_mk1pod_IVA]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }
}

// DE_IVAExtension — stock Mk2 Spaceplane Cockpit.
// Keep the four-display proof that arbitrary MFD counts are supported.
@INTERNAL[DE_mk2CockpitStandardInternals]:NEEDS[RasterPropMonitor]
{
    @PROP[ALCORMFD40x20],0
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],1
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }

    @PROP[ALCORMFD40x20],2
    {
        @name = KMC_ALCORMFD40x20_MAIN_A
    }

    @PROP[ALCORMFD40x20],3
    {
        @name = KMC_ALCORMFD40x20_MAIN_B
    }
}
