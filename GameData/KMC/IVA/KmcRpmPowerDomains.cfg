// KMC Build 14.17.1
// Generic RPM electrical-domain prop families.
//
// This file contains ONLY reusable KMC-aware prop definitions.
// Capsule / IVA-specific wiring belongs under:
//     GameData/KMC/IVA/Profiles/
//
// Profile convention:
// - MAIN_A = primary A-side distribution
// - MAIN_B = primary B-side distribution
// - ESS    = essential / standby distribution
//
// RasterPropMonitor owns the actual display blackout.  KMC supplies the
// electrical availability variable and the recovery cache invalidation helper.
//
// New RPM MFD families can be added here once, then reused by any number of
// IVA profiles without duplicating the power behavior.

+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]
{
    @name = KMC_ALCORMFD40x20_MAIN_A

    @MODULE[RasterPropMonitor]
    {
        %needsElectricCharge = true
        %resourceName = KMC_MAIN_A_POWERED
        %emptyColor = 0,0,0,255
    }

    MODULE
    {
        name = KmcRpmPowerWake
        powerDomain = MAIN_A
    }
}

+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]
{
